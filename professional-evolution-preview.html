<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Evolution Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1016;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e8eef5;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        left: 14px;
        top: 12px;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(8, 14, 22, 0.72);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .bar {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 2;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.28);
        background: rgba(15, 23, 42, 0.78);
        color: #e2e8f0;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting…</div>
    <div id="app"></div>
    <div class="bar">
      <button type="button" id="replay">Replay entrance</button>
      <button type="button" id="complete">Snap complete</button>
    </div>
    <script type="module" src="/src/professional-evolution-preview.js"></script>
  </body>
</html>
