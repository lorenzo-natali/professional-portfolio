<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collectible Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #d8dbe0;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #1f2933;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .bar {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: calc(100% - 32px);
      }
      button {
        appearance: none;
        border: 1px solid rgba(15, 23, 42, 0.14);
        background: rgba(255, 255, 255, 0.82);
        color: #111827;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: rgba(59, 130, 246, 0.55);
        color: #1d4ed8;
      }
      .ref {
        position: fixed;
        top: 12px;
        right: 12px;
        width: min(28vw, 220px);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: #fff;
      }
      .ref img {
        display: block;
        width: 100%;
        height: auto;
      }
      .ref span {
        display: block;
        padding: 6px 8px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #64748b;
      }
      #status {
        position: fixed;
        left: 16px;
        top: 12px;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        max-width: 55vw;
      }
    </style>
  </head>
  <body>
    <div id="status">Starting…</div>
    <div id="app"></div>
    <div class="ref">
      <img src="/ar/collectible/collectible_reference.png" alt="Collectible reference" />
      <span>Reference</span>
    </div>
    <div class="bar">
      <button type="button" data-asset="web" aria-pressed="true">Web (live)</button>
      <button type="button" data-asset="textured" aria-pressed="false">Textured</button>
      <button type="button" data-asset="raw" aria-pressed="false">Raw</button>
      <button type="button" data-view="front" aria-pressed="true">Front</button>
      <button type="button" data-view="three-quarter">3/4</button>
      <button type="button" data-view="side">Side</button>
      <button type="button" data-view="figure-close">Figure</button>
      <button type="button" data-view="ai-cube">AI cube</button>
      <button type="button" data-view="package-edge">Edge</button>
    </div>
    <script type="module" src="/src/collectible-preview.js"></script>
  </body>
</html>
