# Local / example configuration for Portfolio Assistant Worker (Phase A).
# Do NOT put account IDs, API tokens, OpenAI keys, or production secrets in this file.
# Copy to wrangler.local.toml (gitignored) or set values via `wrangler` CLI when deploying.

name = "portfolio-assistant"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# Comma-separated allowed browser Origins for CORS (not authentication).
# Local Vite defaults match workers/portfolio-analytics conventions.
ASSISTANT_ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"
