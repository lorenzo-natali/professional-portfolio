<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Core Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c1016;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #d7dee6;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      .bar {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(18, 24, 32, 0.88);
        color: #e8eef4;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        border-color: rgba(94, 200, 214, 0.55);
        color: #5ec8d6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="bar">
      <button type="button" data-view="front" aria-pressed="true">Front</button>
      <button type="button" data-view="three-quarter">3/4</button>
      <button type="button" data-view="side">Side</button>
      <button type="button" data-view="top">Top</button>
      <button type="button" data-view="expanded">Expanded ASSESS</button>
    </div>
    <script type="module" src="/src/decision-core-preview.js"></script>
  </body>
</html>
